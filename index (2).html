<div id="lib">
 <div class="top"><label class="add" for="bf" id="addb" style="display:inline-block">＋ Добавить книгу</label> <button class="add" id="upd" style="margin-left:8px">↻</button></div>

<script>
const $=id=>document.getElementById(id);
let db=null,mem={};
function open(){return new Promise(r=>{try{const q=indexedDB.open('reader',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function get(k){return new Promise(r=>{if(!db)return r(mem[k]);try{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(mem[k])}catch(e){r(mem[k])}})}
function set(k,v){mem[k]=v;return new Promise(r=>{if(!db)return r();try{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=r}catch(e){r()}})}
let books=[],cur=null,S={fs:20,bg:'#f5ecd7',img:null,dim:30};
const COLORS=['#f5ecd7','#ffffff','#e8e8e8','#cfe8cf','#ffd9a0','#2b2b2b','#000000'];
const EMO=['📖','🌲','🏰','🚀','🌊','🦉','🗝️','🌙'],CL=['#7b3f3f','#3f5f7b','#3f7b55','#7b6a3f','#5e3f7b','#7b3f66'];
function render(){
 const sh=$('shelves');sh.innerHTML='';
 if(!books.length){sh.innerHTML='<div class="empty">Полка пуста.<br>Нажмите «Добавить книгу»</div>';return}
 for(let i=0;i<books.length;i+=3){
  const s=document.createElement('div');s.className='shelf';
  books.slice(i,i+3).forEach((b,j)=>{
   const n=i+j,d=document.createElement('div');d.className='book';
   const bg=b.cover?`background-image:url(${b.cover})`:`background:${CL[n%CL.length]}`;
   d.innerHTML=`<div class="cover" style="${bg}">${b.cover?'':`<div class="pic">${EMO[n%EMO.length]}</div><small>${esc(b.title)}</small>`}<button class="del">✕</button></div><div class="name">${esc(b.title)}</div>`;
   d.onclick=()=>openBook(b);
   const dl=d.querySelector('.del');dl.onclick=async e=>{e.stopPropagation();if(!dl.dataset.s){dl.dataset.s=1;dl.textContent='Удалить?';dl.style.cssText='width:auto;border-radius:11px;padding:0 8px;background:#b00020';setTimeout(()=>{dl.dataset.s='';dl.textContent='✕';dl.style.cssText=''},3000);return}books=books.filter(x=>x!==b);await set('books',books);await set('t'+b.id,'');for(let k=0;k<(b.imgs||0);k++)await del('i'+b.id+':'+k);render()};
   s.appendChild(d)});
  sh.appendChild(s)}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('bf').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{
  $('addb').textContent='⏳ Загрузка…';const nm=f.name.replace(/\.[^.]+$/,'');let b={id:Date.now(),title:nm,text:'',cover:null};
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='epub')await parseEpub(f,b);
  else if(ext==='fb2')await parseFb2(f,b);
  else b.text=await f.text();
  if(!b.text.trim())throw 0;
  await set('t'+b.id,b.text);b.text='';books.push(b);await set('books',books);render();
 }catch(x){alert('Не удалось прочитать файл. Поддерживаются TXT, FB2, EPUB.')}finally{$('addb').textContent='＋ Добавить книгу'}
};
function del(k){delete mem[k];return new Promise(r=>{if(!db)return r();try{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=r;t.onerror=r}catch(e){r()}})}
async function addImg(url,ctx){if(!url)return '';try{const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});
 if(im.naturalWidth<60||im.naturalHeight<60)return '';
 const k=Math.min(1,1000/im.naturalWidth),w=Math.round(im.naturalWidth*k),hh=Math.round(im.naturalHeight*k),c=document.createElement('canvas');c.width=w;c.height=hh;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,hh);x.drawImage(im,0,0,w,hh);
 const id=ctx.n++;await set('i'+ctx.id+':'+id,c.toDataURL('image/jpeg',.8));return '\n\u0001'+id+'|'+w+'|'+hh+'\u0002\n'}catch(e){return ''}finally{if(url.startsWith('blob:'))URL.revokeObjectURL(url)}}
async function zurl(z,p){p=decodeURI(p);const f=z.file(p);if(!f)return '';const ab=await f.async('arraybuffer');const ext=p.split('.').pop().toLowerCase();const mt={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml'}[ext]||'image/jpeg';return URL.createObjectURL(new Blob([ab],{type:mt}))}
async function parseFb2(f,b){
 const buf=await f.arrayBuffer();let t=new TextDecoder('utf-8').decode(buf);
 const m=t.match(/encoding="([^"]+)"/i);if(m&&!/utf-8/i.test(m[1]))t=new TextDecoder(m[1]).decode(buf);
 const x=new DOMParser().parseFromString(t,'text/xml');
 const tt=x.querySelector('book-title');if(tt)b.title=tt.textContent.trim();
 const bin={};x.querySelectorAll('binary').forEach(n=>{bin[n.getAttribute('id')]='data:'+(n.getAttribute('content-type')||'image/jpeg')+';base64,'+n.textContent.replace(/\s/g,'')});
 const href=c=>(c.getAttribute('l:href')||c.getAttribute('xlink:href')||c.getAttribute('href')||'').replace('#','');
 const cp=x.querySelector('coverpage image');if(cp&&bin[href(cp)])b.cover=bin[href(cp)];
 const ctx={id:b.id,n:0},toc=[];let out='';
 const walk=async n=>{for(const c of n.children){const k=c.localName;
  if(k==='section'){const ti=c.querySelector(':scope > title');if(ti)toc.push({o:out.length,n:ti.textContent.replace(/\s+/g,' ').trim()});await walk(c)}
  else if(k==='title')out+=c.textContent.replace(/\s+/g,' ').trim()+'\n\n';
  else if(k==='image')out+=await addImg(bin[href(c)],ctx);
  else if(k==='p'||k==='subtitle'||k==='v'||k==='text-author')out+=c.textContent.trim()+'\n\n';
  else if(k==='empty-line')out+='\n';
  else await walk(c)}};
 for(const body of x.querySelectorAll('body')){if(body.getAttribute('name')!=='notes')await walk(body)}
 b.text=out;b.toc=toc;b.imgs=ctx.n;
}
function dd(s){const L=s.split('\n');let last='',k=0;return L.filter(x=>{const y=x.trim();if(!y)return true;k++;const dup=k<=14&&y===last&&y.length<150;last=y;return !dup}).join('\n')}
async function parseEpub(f,b){
 const z=await JSZip.loadAsync(f);const P=new DOMParser();const ctx={id:b.id,n:0};
 const rd=async p=>z.file(p)?await z.file(p).async('string'):'';
 const cont=P.parseFromString(await rd('META-INF/container.xml'),'text/xml');
 const opfP=cont.querySelector('rootfile').getAttribute('full-path');
 const dir=opfP.includes('/')?opfP.replace(/[^/]+$/,''):'';
 const nrm=(base,href)=>decodeURI(new URL(href,'http://x/'+base).pathname.slice(1));
 const opf=P.parseFromString(await rd(opfP),'text/xml');
 const t=opf.getElementsByTagName('dc:title')[0];if(t)b.title=t.textContent.trim();
 const items={};opf.querySelectorAll('manifest > item').forEach(i=>items[i.getAttribute('id')]=i);
 const its=Object.values(items);
 let ci=its.find(i=>(i.getAttribute('properties')||'').includes('cover-image'));
 if(!ci){const mc=opf.querySelector('meta[name="cover"]');if(mc)ci=items[mc.getAttribute('content')]}
 if(ci){const fl=z.file(nrm(dir,ci.getAttribute('href')));if(fl){const d=await fl.async('base64');b.cover='data:'+(ci.getAttribute('media-type')||'image/jpeg')+';base64,'+d}}
 const map={},add=(base,href,label)=>{if(!href||!label)return;try{const p=nrm(base,href.split('#')[0]);if(!(p in map))map[p]=label.replace(/\s+/g,' ').trim()}catch(e){}};
 const nv=its.find(i=>(i.getAttribute('properties')||'').includes('nav'));
 if(nv){const np=nrm(dir,nv.getAttribute('href'));const d=P.parseFromString(await rd(np),'text/html');d.querySelectorAll('nav a').forEach(a=>add(np,a.getAttribute('href'),a.textContent))}
 const nc=its.find(i=>i.getAttribute('media-type')==='application/x-dtbncx+xml');
 if(nc){const np=nrm(dir,nc.getAttribute('href'));const d=P.parseFromString(await rd(np),'text/xml');d.querySelectorAll('navPoint').forEach(n=>{const l=n.querySelector(':scope > navLabel > text'),c=n.querySelector(':scope > content');if(l&&c)add(np,c.getAttribute('src'),l.textContent)})}
 let out='';const toc=[];
 for(const r of opf.querySelectorAll('spine > itemref')){
  const it=items[r.getAttribute('idref')];if(!it)continue;
  const fp=nrm(dir,it.getAttribute('href'));
  const d=P.parseFromString(await rd(fp),'text/html');
  d.querySelectorAll('script,style').forEach(n=>n.remove());
  const hd=d.body.querySelector('h1,h2,h3'),title=map[fp]||(hd?hd.textContent.replace(/\s+/g,' ').trim():'');
  for(const im of [...d.body.querySelectorAll('img,image')]){
   const src=im.getAttribute('src')||im.getAttribute('xlink:href')||im.getAttribute('href')||'';
   let mk='';if(src)mk=await addImg(src.startsWith('data:')?src:await zurl(z,new URL(src,'http://x/'+fp).pathname.slice(1)),ctx);
   im.replaceWith(d.createTextNode(mk))}
  d.body.querySelectorAll('p,h1,h2,h3,h4,div,li').forEach(n=>n.append('\n'));
  const tx=dd(d.body.textContent.replace(/\r/g,'').replace(/\n{3,}/g,'\n\n').trim());
  if(title)toc.push({o:out.length,n:title.slice(0,120)});
  out+=tx+'\n\n';
 }
 b.text=out;b.toc=toc;b.imgs=ctx.n;
}
function apply(){
 const r=$('rd'),dark=lum(S.bg)<.4;
 r.style.backgroundColor=S.bg;
 r.style.backgroundImage=S.img?`url(${S.img})`:'none';
 $('ov').style.background=S.img?`rgba(0,0,0,${S.dim/100})`:'none';
 const light=S.tc?lum(S.tc)>.5:(S.img?S.dim>=35:dark);
 $('txt').style.color=S.tc||(light?'#f5f5f5':(S.img?'#161616':'#2a2118'));
 $('txt').style.textShadow='none';$('txt').style.background='none';
 $('txt').style.fontSize=S.fs+'px';$('fv').textContent=S.fs;
 $('fs').value=S.fs;$('dim').value=S.dim;
}
function lum(h){const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255}
let CH=[],loaded=0,CHs=[],TXT='',GR=[],FL=[];
function ru(s){return s.replace(/\bVolume\b/gi,'Том').replace(/\bChapter\b/gi,'Глава').replace(/\bPrologue\b/gi,'Пролог').replace(/\bEpilogue\b/gi,'Эпилог').replace(/\bPart\b/gi,'Часть').replace(/\bBook\b/gi,'Книга').replace(/\s+/g,' ').trim()}
function splitN(n){const m=n.match(/^Том\s*(\d+(?:\.\d+)?)\s*[,.:\-–—]*\s*(.*)$/i);return m?{v:m[1],name:m[2]}:{v:null,name:n}}
function group(raw){const G=[],F=[];let cv=null,g=null;
 raw.forEach(e=>{const s=splitN(ru(e.n));if(s.v!==null&&s.v!==cv){cv=s.v;g={v:cv,o:e.o,items:[]};G.push(g)}
  if(!s.name)return;if(!g){g={v:null,o:e.o,items:[]};G.push(g)}
  const c={o:e.o,n:s.name};g.items.push(c);F.push(c)});return[G,F]}
function fill(s,txt){const re=/\u0001(\d+)\|(\d+)\|(\d+)\u0002/g;let i=0,m;
 while((m=re.exec(txt))){if(m.index>i)s.appendChild(document.createTextNode(txt.slice(i,m.index).replace(/\n$/,'')));
  const im=document.createElement('img');im.style.aspectRatio=m[2]+'/'+m[3];im.style.maxWidth=m[2]+'px';im.alt='';
  get('i'+cur.id+':'+m[1]).then(u=>{if(u)im.src=u});s.appendChild(im);i=re.lastIndex}
 if(i<txt.length)s.appendChild(document.createTextNode(txt.slice(i).replace(/^\n/,'')))}
async function openBook(b){
 cur=b;$('lib').style.visibility='hidden';$('rd').style.display='block';$('txt').textContent='Загрузка…';apply();hideUi();
 const t=((await get('t'+b.id))||b.text||'').replace(/\r/g,'');TXT=t;
 CH=[];CHs=[];for(let i=0;i<t.length;){let e=Math.min(i+8000,t.length);const n=t.indexOf('\n',e);e=(n<0||n-e>2000)?e:n+1;CH.push(t.slice(i,e));CHs.push(i);i=e}
 let raw=[];
 if(b.toc&&b.toc.length>1){const E=b.toc.map(e=>({o:e.o,n:e.n,t:1})),V=[],vr=/^[ \t]*(Том\s*\d+(?:\.\d+)?(?:[ \t]*[.:\-–—][^\n]{0,70})?)[ \t]*$/gim;let m;
  while((m=vr.exec(t))&&V.length<500){if(/глава|chapter/i.test(m[1]))continue;let o=m.index+m[0].indexOf(m[1]),p=null;for(const e of E){if(e.o<=o)p=e;else break}if(p&&o-p.o<800)o=p.o;V.push({o:o,n:m[1].trim(),t:0})}
  raw=[...V,...E].sort((a,b)=>a.o-b.o||a.t-b.t)}
 if(!raw.length){const re=/^[ \t]*((?:глава|часть|том|книга|пролог|эпилог|предисловие|chapter|part|book|volume|prologue|epilogue)(?=[\s.:\-–—\dIVXLC]|$)[^\n]{0,70})[ \t]*$/gim;let m;
  while((m=re.exec(t))&&raw.length<2000)raw.push({o:m.index+m[0].indexOf(m[1]),n:m[1].trim()})}
 [GR,FL]=group(raw);
 if(!FL.length){const g={v:null,o:0,items:[]};GR=[g];FL=g.items;for(let i=0;i<t.length;i+=30000)g.items.push({o:i,n:'Часть '+(i/30000+1)})}
 const el=$('txt');el.textContent='';loaded=0;more();
 if(b.off!=null)goOff(b.off);else{const pos=b.pos||0;while(loaded<CH.length&&el.scrollHeight<pos+el.clientHeight*2)more();el.scrollTop=pos}
}
function more(){if(loaded<CH.length){const s=document.createElement('span');fill(s,CH[loaded++]);$('txt').appendChild(s)}}
function goOff(o){const el=$('txt');let i=CHs.length-1;for(let k=0;k<CHs.length;k++){if(CHs[k+1]===undefined||CHs[k+1]>o){i=k;break}}
 while(loaded<=i)more();
 const s=el.children[i];if(!s)return;const len=(CHs[i+1]===undefined?TXT.length:CHs[i+1])-CHs[i];
 el.scrollTop=Math.max(0,s.offsetTop+(o-CHs[i])/Math.max(1,len)*s.offsetHeight-60)}
function curOff(){const el=$('txt'),y=el.scrollTop+60,c=el.children;let i=0;for(let k=0;k<c.length;k++){if(c[k].offsetTop<=y)i=k;else break}
 const s=c[i];if(!s)return 0;const len=(CHs[i+1]===undefined?TXT.length:CHs[i+1])-CHs[i];
 return Math.round(CHs[i]+Math.min(1,Math.max(0,(y-s.offsetTop)/Math.max(1,s.offsetHeight)))*len)}
function chapAt(o){let n='';for(const c of FL){if(c.o<=o)n=c.n;else break}return n}
function ui(v){['gear','back','tocb','bm'].forEach(i=>$(i).style.display=v?'block':'none')}
function hideUi(){ui(0)}
$('txt').addEventListener('scroll',()=>{if(cur){const el=$('txt');if(el.scrollTop+el.clientHeight*3>el.scrollHeight)more();cur.pos=el.scrollTop;clearTimeout(window._t);window._t=setTimeout(()=>{cur.off=curOff();set('books',books)},600)}});
$('txt').addEventListener('click',e=>{
 const y=e.clientY/innerHeight,x=e.clientX/innerWidth;
 if(x>.25&&x<.75&&y>.25&&y<.75){ui($('gear').style.display!=='block')}
 else hideUi();
});
$('back').onclick=async()=>{if(cur)cur.off=curOff();await set('books',books);$('toc').style.display='none';$('rd').style.display='none';$('set').style.display='none';$('lib').style.visibility='visible';$('txt').textContent='';cur=null};
$('gear').onclick=()=>{$('set').style.display='block'};
let tab='c';
function drawToc(keep){const L=$('tlist'),st=L.scrollTop,o=curOff(),n=Math.max(1,TXT.length),desc=S.desc!==false,rd=cur.read==null?-1:cur.read;
 $('tpc').textContent=Math.round(o/n*100)+'%';$('tso').textContent=desc?'↓':'↑';$('tso').style.display=tab==='c'?'':'none';
 $('tc1').className=tab==='c'?'on':'';$('tm1').className=tab==='m'?'on':'';$('addm').style.display=tab==='m'?'block':'none';
 let h='',co=-1;FL.forEach(c=>{if(c.o<=o)co=c.o});
 if(tab==='c'){(desc?[...GR].reverse():GR).forEach(g=>{
  if(g.v!==null)h+='<div class="tv" data-o="'+g.o+'">Том '+esc(g.v)+'</div>';
  (desc?[...g.items].reverse():g.items).forEach(c=>{h+='<div class="ti'+(rd>=0&&c.o<rd?' rd':'')+(c.o===rd?' bk':'')+(c.o===co?' cur':'')+'" data-o="'+c.o+'"><button class="x b" data-b="'+c.o+'">🔖</button>'+esc(c.n)+'</div>'})})}
 else{(cur.marks||[]).forEach((m,i)=>{h+='<div class="ti" data-o="'+m.o+'"><b>'+esc(m.c||'Закладка')+'</b> · '+Math.round(m.o/n*100)+'%<br><small>'+esc(m.t)+'</small><button class="x" data-d="'+i+'">✕</button></div>'});if(!h)h='<div style="padding:16px;opacity:.6">Закладок пока нет</div>'}
 L.innerHTML=h;
 if(keep)L.scrollTop=st;else{const c=L.querySelector('.cur')||L.querySelector('.bk');if(c)c.scrollIntoView({block:'center'})}}
async function addMark(){const o=curOff();cur.marks=cur.marks||[];cur.marks.push({o:o,t:TXT.substr(o,80).replace(/\u0001[^\u0002]*\u0002/g,'🖼 ').replace(/\s+/g,' ').trim()||'…',c:chapAt(o)});await set('books',books)}
$('tocb').onclick=()=>{tab='c';$('toc').style.display='flex';drawToc()};
$('tc1').onclick=()=>{tab='c';drawToc()};$('tm1').onclick=()=>{tab='m';drawToc()};
$('tso').onclick=()=>{S.desc=S.desc===false;set('S',S);drawToc()};
$('tx').onclick=()=>{$('toc').style.display='none';hideUi()};
$('addm').onclick=async()=>{await addMark();drawToc(1)};
$('bm').onclick=async()=>{await addMark();$('bm').textContent='✓';setTimeout(()=>$('bm').textContent='🔖',1000)};
$('tlist').onclick=async e=>{const t=e.target,d=t.dataset.d,bk=t.dataset.b;
 if(d!==undefined){cur.marks.splice(+d,1);await set('books',books);drawToc(1);return}
 if(bk!==undefined){cur.read=cur.read===+bk?null:+bk;await set('books',books);drawToc(1);return}
 const r=t.closest('.ti,.tv');if(r){goOff(+r.dataset.o);$('toc').style.display='none';hideUi()}};
$('upd').onclick=async()=>{try{for(const x of await navigator.serviceWorker.getRegistrations())await x.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.reload()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cur){cur.off=curOff();set('books',books)}});
$('close').onclick=()=>{$('set').style.display='none';hideUi()};
$('fs').oninput=e=>{const o=cur?curOff():0;S.fs=+e.target.value;apply();if(cur)goOff(o);set('S',S)};
$('dim').oninput=e=>{S.dim=+e.target.value;apply();set('S',S)};
(()=>{const a=document.createElement('i');a.textContent='Авто';a.style.cssText='width:auto;border-radius:18px;padding:8px 12px;font-size:13px;font-style:normal;background:#eee';a.onclick=()=>{S.tc=null;apply();set('S',S)};$('tcs').appendChild(a);
['#ffffff','#f5e6c8','#ffe27a','#9be7ff','#222222','#000000'].forEach(c=>{const i=document.createElement('i');i.style.background=c;i.onclick=()=>{S.tc=c;apply();set('S',S)};$('tcs').appendChild(i)});
const p=document.createElement('input');p.type='color';p.value='#ffffff';p.oninput=e=>{S.tc=e.target.value;apply();set('S',S)};$('tcs').appendChild(p)})();
COLORS.forEach(c=>{const i=document.createElement('i');i.style.background=c;i.onclick=()=>{S.bg=c;S.img=null;apply();set('S',S)};$('bgs').appendChild(i)});
const cp=document.createElement('input');cp.type='color';cp.value='#f5ecd7';cp.oninput=e=>{S.bg=e.target.value;S.img=null;apply();set('S',S)};$('bgs').appendChild(cp);
$('addbg').onclick=()=>$('imf').click();
$('rmbg').onclick=()=>{S.img=null;apply();set('S',S)};
$('imf').onchange=e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 const fr=new FileReader();fr.onload=()=>{
  const im=new Image();im.onload=()=>{
   // уменьшаем фото, чтобы хранилось легко; отображение cover подгоняет под любой экран
   const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');
   c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   S.img=c.toDataURL('image/jpeg',.85);apply();set('S',S)};
  im.src=fr.result};fr.readAsDataURL(f)};
(async()=>{await open();books=(await get('books'))||[];const s=await get('S');if(s)S=Object.assign(S,s);if(S.dim<50&&!S.mig){S.dim=50;S.mig=1}render()})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
